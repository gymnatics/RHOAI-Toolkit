FEATURE_ADMIN_USER=false
FEATURE_MAAS_DB=false
FEATURE_MAAS_TLS=false
FEATURE_MAAS_RATE_LIMITING=false
FEATURE_MAAS_VERIFY=false
FEATURE_OBSERVABILITY=false
FEATURE_MLFLOW=false
FEATURE_MCP_LIFECYCLE=false
FEATURE_PIPELINE_SERVER=false
FEATURE_DEMO_USERS=false
FEATURE_GRAFANA=false
FEATURE_GATEWAY_TELEMETRY=false
FEATURE_INGRESS_ISTIO_PATCH=false

################################################################################
# RHOAI 3.3 Version Profile
# Sourced by install-rhoai.sh to configure version-specific behavior
################################################################################

RHOAI_VERSION_LABEL="3.3"
OCP_MIN_VERSION="4.19"

# Manifests
DSC_MANIFEST="lib/manifests/rhoai/datasciencecluster-v3.yaml"
RHCL_MANIFEST="lib/manifests/rhcl/rhcl-operator.yaml"
HW_PROFILE_MANIFEST=""
UWM_MANIFEST=""

# RHCL namespace (3.3: everything in kuadrant-system)
RHCL_SUBSCRIPTION_NAMESPACE="kuadrant-system"

# TLS strategy: cert-manager (3.3)
TLS_STRATEGY="cert-manager"

# Istio version fallback
ISTIO_FALLBACK_VERSION="v1.26.2"

# Service Mesh operator: inline YAML (3.3)
SM3_USE_MANIFEST=false

# Gateway: inline YAML (3.3)
GATEWAY_USE_MANIFESTS=false

# LWS operator CR: inline YAML (3.3)
LWS_CR_USE_MANIFEST=false

# DSCI: not needed for 3.3
APPLY_DSCI=false

# Dashboard URL
DASHBOARD_ROUTE_NAMES="data-science-gateway"
DASHBOARD_URL_FALLBACK="data-science-gateway"

# No extra dashboard flags for 3.3
DASHBOARD_EXTRA_FLAGS=""


################################################################################
# RHOAI 3.4 Version Profile
# Sourced by install-rhoai.sh to configure version-specific behavior
################################################################################

RHOAI_VERSION_LABEL="3.4"
OCP_MIN_VERSION="4.19"

# Manifests
DSC_MANIFEST="lib/manifests/rhoai/datasciencecluster-v3-34.yaml"
RHCL_MANIFEST="lib/manifests/rhcl/rhcl-operator-34.yaml"
HW_PROFILE_MANIFEST="lib/manifests/rhoai/hardware-profile-gpu.yaml"
UWM_MANIFEST="lib/manifests/monitoring/cluster-monitoring-config.yaml"

# RHCL namespace (3.4: subscription in openshift-operators; 3.3: kuadrant-system)
RHCL_SUBSCRIPTION_NAMESPACE="openshift-operators"

# TLS strategy: service-ca (3.4) or cert-manager (3.3)
TLS_STRATEGY="service-ca"

# Istio version fallback when no existing Istio is detected
ISTIO_FALLBACK_VERSION="v1.30.1"

# Service Mesh operator: use manifest file (3.4) or inline YAML (3.3)
SM3_USE_MANIFEST=true

# Gateway: use manifest files (3.4) or inline YAML (3.3)
GATEWAY_USE_MANIFESTS=true

# LWS operator CR: use manifest file (3.4) or inline YAML (3.3)
LWS_CR_USE_MANIFEST=true

# DSCI: apply DSCInitialization manifest before DSC (3.4 only)
APPLY_DSCI=true

# Dashboard URL route name preference (tried in order)
DASHBOARD_ROUTE_NAMES="rh-ai data-science-gateway"
DASHBOARD_URL_FALLBACK="rh-ai"

# Dashboard feature flags (version-specific extras beyond the base set)
DASHBOARD_EXTRA_FLAGS='"maasAuthPolicies": true, "vLLMDeploymentOnMaaS": true, "mcpCatalog": true'

# Feature gates (phases that only run if true)
FEATURE_ADMIN_USER=true
FEATURE_MAAS_DB=true
FEATURE_MAAS_TLS=true
FEATURE_MAAS_RATE_LIMITING=true
FEATURE_MAAS_VERIFY=true
FEATURE_OBSERVABILITY=true
FEATURE_MLFLOW=true
FEATURE_MCP_LIFECYCLE=true
FEATURE_PIPELINE_SERVER=true
FEATURE_DEMO_USERS=true
FEATURE_GRAFANA=true
FEATURE_GATEWAY_TELEMETRY=true
FEATURE_INGRESS_ISTIO_PATCH=true
FEATURE_RHCL_COMPONENT_VERIFY=true
FEATURE_GATEWAY_TLS_SECRET=true
FEATURE_GATEWAY_PASSTHROUGH_ROUTES=true
FEATURE_GATEWAY_RESOURCE_OVERRIDES=true

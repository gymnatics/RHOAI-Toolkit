apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: the keycloak-db-secret referenced by postgres-deployment.yaml and
# keycloak.yaml must be created imperatively before applying this kustomization:
#   oc create secret generic keycloak-db-secret -n maas-keycloak \
#     --from-literal=username=keycloak \
#     --from-literal=password="$(openssl rand -base64 16 | tr -d '=+/')"
resources:
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - keycloak.yaml
  - realm-import.yaml

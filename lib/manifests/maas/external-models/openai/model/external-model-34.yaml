# RHOAI 3.4 only. Standalone ExternalModel (no separate ExternalProvider CR --
# that was introduced in 3.5). API group is maas.opendatahub.io, not
# inference.opendatahub.io. Apply this INSTEAD of external-provider.yaml +
# external-model.yaml on 3.4 clusters:
#   oc apply -f external-model-34.yaml
#
# The credential Secret ("openai-api-key") must be created imperatively and
# labeled inference.networking.k8s.io/bbr-managed=true (not ipp-managed, which
# is the 3.5+ label) so the BBR ext-proc can inject it:
#   oc create secret generic openai-api-key -n external-models \
#     --from-literal=api-key="$OPENAI_API_KEY"
#   oc label secret openai-api-key -n external-models \
#     inference.networking.k8s.io/bbr-managed=true --overwrite
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gpt-4o-mini
  namespace: external-models
spec:
  provider: openai
  targetModel: gpt-4o-mini
  endpoint: api.openai.com
  credentialRef:
    name: openai-api-key

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# RHOAI 3.5+ default. For RHOAI 3.4, do NOT use `oc apply -k .` here -- instead
# apply external-model-34.yaml standalone (different API group, no ExternalProvider):
#   oc apply -f external-model-34.yaml
resources:
  - external-provider.yaml
  - external-model.yaml

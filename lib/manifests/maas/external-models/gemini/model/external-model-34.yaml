# RHOAI 3.4 only.
#
# KNOWN BROKEN on 3.4 (RHOAIENG-68592): the BBR `openai` provider hardcodes the
# upstream path to /v1/chat/completions, but Gemini requires
# /v1beta/openai/chat/completions. There is no `path` override field in the 3.4
# ExternalModel CRD, so requests return HTTP 404. No workaround exists on 3.4 --
# upgrade to RHOAI 3.5+ to use Gemini as an external model. This manifest is
# kept for completeness / documentation of the limitation.
#
#   oc create secret generic gemini-api-key -n external-models \
#     --from-literal=api-key="$GEMINI_API_KEY"
#   oc label secret gemini-api-key -n external-models \
#     inference.networking.k8s.io/bbr-managed=true --overwrite
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gemini-2.5-flash
  namespace: external-models
spec:
  provider: openai
  targetModel: gemini-2.5-flash
  endpoint: generativelanguage.googleapis.com
  credentialRef:
    name: gemini-api-key

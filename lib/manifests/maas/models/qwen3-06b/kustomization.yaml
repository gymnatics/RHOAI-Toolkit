apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Qwen3-0.6B: a real (non-simulated) CPU-only LLM. Good for clusters without
# GPU infrastructure that still need actual inference, not just a simulator.
# Deploy with:
#   oc create namespace llm --dry-run=client -o yaml | oc apply -f -
#   oc label namespace llm opendatahub.io/generated-namespace=true maas.opendatahub.io/gateway-access=true opendatahub.io/dashboard=true --overwrite
#   oc apply -k lib/manifests/maas/models/qwen3-06b/
# Or via the orchestrating script: scripts/deploy-maas-model.sh --model qwen3-06b
resources:
  - llm
  - maas

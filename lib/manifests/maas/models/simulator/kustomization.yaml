apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CPU-only simulator model. Deploy with:
#   oc create namespace llm --dry-run=client -o yaml | oc apply -f -
#   oc label namespace llm opendatahub.io/generated-namespace=true maas.opendatahub.io/gateway-access=true opendatahub.io/dashboard=true --overwrite
#   oc apply -k lib/manifests/maas/models/simulator/
# Or via the orchestrating script: scripts/deploy-maas-model.sh --model simulator
resources:
  - llm
  - maas

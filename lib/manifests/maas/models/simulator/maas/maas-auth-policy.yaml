# Grants all authenticated users access to the simulator model.
#
# NOTE: spec.modelRefs (plural array) + spec.subjects.groups is the correct schema --
# verified against a live RHOAI 3.5 cluster and matching
# lib/functions/model-deployment.sh::publish_model_to_maas.
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: simulator-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: simulator
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated

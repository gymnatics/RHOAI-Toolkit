# Premium tier subscription for simulator model (100,000 tokens/min)
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: simulator-premium
  namespace: models-as-a-service
spec:
  modelRef:
    name: simulator
    namespace: ${MODEL_NAMESPACE}
  priority: 20
  subjects:
    - kind: Group
      name: system:authenticated
  tokenRateLimits:
    - limit: 100000
      window: 1m

# CPU-only simulator model for MaaS platform validation
# No GPU required — uses llm-d-inference-sim container
# Deploys in ~30 seconds, useful for testing gateway, auth, rate limiting
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: simulator
  namespace: ${MODEL_NAMESPACE}
spec:
  modelSpec:
    containers:
      - name: simulator
        image: quay.io/opendatahub/llm-d-inference-sim:latest
        ports:
          - containerPort: 8000
            protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

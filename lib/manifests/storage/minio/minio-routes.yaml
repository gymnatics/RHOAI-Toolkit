---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  port:
    targetPort: api
  to:
    kind: Service
    name: minio
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio-console
  labels:
    app.kubernetes.io/name: minio
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  port:
    targetPort: console
  to:
    kind: Service
    name: minio

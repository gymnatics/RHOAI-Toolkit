# DEPRECATED: MinIO storage backend. Use SeaweedFS (--backend=seaweedfs) instead.
# See docs/guides/S3-BACKEND-MIGRATION.md for migration instructions.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
      - name: minio
        # quay.io/minio/minio is no longer anonymously pullable (2026-11); ODH-pinned 2019 build. Prefer SeaweedFS (toolkit default).
        image: quay.io/opendatahub/minio:RELEASE.2019-08-14T20-37-41Z-license-compliance
        imagePullPolicy: IfNotPresent
        args: ["server", "/data"]
        envFrom:
        - secretRef:
            name: minio
        env:
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio
              key: MINIO_ROOT_USER
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio
              key: MINIO_ROOT_PASSWORD
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: models-pvc

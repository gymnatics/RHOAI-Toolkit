---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  type: ClusterIP
  ports:
  - name: s3
    port: 8333
    targetPort: s3
  - name: master
    port: 9333
    targetPort: master
  - name: filer
    port: 8888
    targetPort: filer
  selector:
    app.kubernetes.io/name: seaweedfs

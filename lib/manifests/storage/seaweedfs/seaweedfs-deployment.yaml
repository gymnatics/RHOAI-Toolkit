# SeaweedFS all-in-one Deployment for OpenShift
#
# Runs master + volume + filer + S3 gateway in a single pod using 'weed server'.
# Suitable for demos and single-node deployments. For production multi-replica
# topology, use the SeaweedFS Helm chart with openshift-values.yaml instead:
#   https://github.com/seaweedfs/seaweedfs/blob/master/k8s/charts/seaweedfs/openshift-values.yaml
#
# OpenShift SCC compliance:
#   - runAsNonRoot: true (no UID specified; OpenShift assigns from namespace range)
#   - drop: ALL capabilities
#   - seccompProfile: RuntimeDefault
#   - PVC storage (no hostPath)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seaweedfs
        image: docker.io/chrislusf/seaweedfs:latest
        imagePullPolicy: IfNotPresent
        command:
        - weed
        args:
        - server
        - -dir=/data
        - -s3
        - -s3.port=8333
        - -s3.config=/etc/seaweedfs/s3.json
        - -master.port=9333
        - -volume.port=8080
        - -filer
        - -filer.port=8888
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        ports:
        - name: s3
          containerPort: 8333
          protocol: TCP
        - name: master
          containerPort: 9333
          protocol: TCP
        - name: filer
          containerPort: 8888
          protocol: TCP
        - name: volume
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /cluster/status
            port: master
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: s3
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-data
      - name: s3-config
        secret:
          secretName: seaweedfs-s3-config

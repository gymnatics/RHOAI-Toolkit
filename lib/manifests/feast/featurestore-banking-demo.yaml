# Banking Feature Store Demo
# Source: https://github.com/RHRolun/banking-feature-store
#
# This creates a complete banking feature store demo with:
# - Customer demographics features
# - Transaction aggregations (7d, 30d, 90d)
# - ATM usage patterns
# - Branch performance metrics
# - Call center analytics
# - Risk scoring (on-demand)
#
# RBAC gotcha (auto-fixed by the toolkit, manual if applying this YAML directly):
# feature_repo/permissions.py hardcodes `prod_namespaces = ["banking"]`, which
# is meant to be an OpenShift *namespace* but is actually the Feast *project*
# name. Unless you deploy into a namespace literally called "banking", every
# registry DESCRIBE/list call is denied ("User is not added into the permitted
# namespaces") and the FeatureStore silently vanishes from the dashboard even
# though every pod is Running. Deploying via `rhoai-toolkit.sh` (deploy_banking_demo)
# now patches this automatically on the feast-data PVC after the pod comes up -
# no fork/push needed. If applying this manifest directly (Option 2), patch it
# yourself after the pod is running:
#   FEAST_POD=$(oc get pods -n <namespace> -o name | grep feast-banking | sed 's|pod/||')
#   oc exec -n <namespace> $FEAST_POD -c registry -- \
#     sed -i 's/prod_namespaces = \[.*\]/prod_namespaces = ["<namespace>"]/' \
#     /feast-data/banking/feature_repo/permissions.py
#   oc exec -n <namespace> $FEAST_POD -c registry -- sh -c "cd /feast-data/banking/feature_repo && feast apply"
#
# After applying (two-step approach from CAI guide):
# 1. Apply this YAML (restAPI starts as false)
# 2. Wait for feast pod to be running
# 3. Flip restAPI to true:
#    oc patch featurestore banking -n <namespace> --type=merge \
#      -p '{"spec":{"services":{"registry":{"local":{"server":{"restAPI":true}}}}}}'
# 4. Run: oc exec -n <namespace> <feast-pod> -c registry -- feast apply
# 5. Run: oc exec -n <namespace> <feast-pod> -c registry -- feast materialize 2025-01-01T00:00:00 $(date -u +'%Y-%m-%dT%H:%M:%S')
#
# RHOAI Version Compatibility:
# - RHOAI 3.2: Works with this configuration
# - RHOAI 3.3+: Requires ALL of the following for dashboard visibility:
#   1. Label: feature-store-ui: enabled (in metadata.labels)
#   2. Registry restAPI: true (in spec.services.registry.local.server)
#   3. Namespace label: opendatahub.io/dashboard=true
#   4. Services: feast-<name>-registry AND feast-<name>-registry-rest must exist
#
# If FeatureStore disappears from dashboard after 3.2→3.3 upgrade:
#   oc label featurestore banking -n <namespace> feature-store-ui=enabled --overwrite
#   oc patch featurestore banking -n <namespace> --type=merge \
#     -p '{"spec":{"services":{"registry":{"local":{"server":{"restAPI":true}}}}}}'
#
---
apiVersion: feast.dev/v1alpha1
kind: FeatureStore
metadata:
  labels:
    feature-store-ui: enabled
    opendatahub.io/dashboard: "true"
  name: banking
spec:
  feastProject: banking
  feastProjectDir:
    git:
      ref: rbac
      url: 'https://github.com/RHRolun/banking-feature-store'
  services:
    offlineStore:
      server:
        logLevel: debug
    onlineStore:
      server:
        logLevel: debug
    registry:
      local:
        server:
          restAPI: false

# FeatureStore template with restAPI: true
# Used in setup_feature_store for new FeatureStore creation.
#
# Variables:
#   ${NAMESPACE}     - Target namespace
#   ${FEAST_PROJECT} - Feast project name
#   ${GIT_REF}       - Git branch/tag
#   ${GIT_URL}       - Git repository URL
#   ${EXTRA_LABELS}  - Pre-formatted extra labels (RHOAI 3.3+ dashboard label)
---
apiVersion: feast.dev/v1alpha1
kind: FeatureStore
metadata:
  labels:
    feature-store-ui: enabled
${EXTRA_LABELS}
  name: ${FEAST_PROJECT}
spec:
  feastProject: ${FEAST_PROJECT}
  feastProjectDir:
    git:
      ref: ${GIT_REF}
      url: '${GIT_URL}'
  services:
    offlineStore:
      server:
        logLevel: debug
    onlineStore:
      server:
        logLevel: debug
    registry:
      local:
        server:
          restAPI: true

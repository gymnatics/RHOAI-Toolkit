apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-context7
  namespace: mcp-servers
spec:
  hostnames:
  - mcp.${CLUSTER_DOMAIN}
  parentRefs:
  - name: maas-default-gateway
    namespace: openshift-ingress
    sectionName: mcp
  rules:
  - backendRefs:
    - name: mcp-context7
      port: 3001
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-controller
  namespace: mcp-gateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-gateway-controller
rules:
- apiGroups: ["mcp.kuadrant.io"]
  resources: ["mcpgatewayextensions", "mcpgatewayextensions/status", "mcpgatewayextensions/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["mcp.kuadrant.io"]
  resources: ["mcpserverregistrations", "mcpserverregistrations/status", "mcpserverregistrations/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "httproutes", "httproutes/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "secrets", "configmaps", "serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-gateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-gateway-controller
subjects:
- kind: ServiceAccount
  name: mcp-controller
  namespace: mcp-gateway-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: mcp-gateway-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway-controller
  namespace: mcp-gateway-system
  labels:
    app: mcp-gateway-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-gateway-controller
  template:
    metadata:
      labels:
        app: mcp-gateway-controller
    spec:
      serviceAccountName: mcp-controller
      containers:
      - name: controller
        image: registry.redhat.io/rhcl-tech-preview/mcp-gateway-rhel9-operator@sha256:d523288fad298f12a8dfc559ff279c06811b32db418c0ffd7a291bfd115fef82
        imagePullPolicy: IfNotPresent
        env:
        - name: RELATED_IMAGE_ROUTER_BROKER
          value: registry.redhat.io/rhcl-tech-preview/mcp-gateway-rhel9@sha256:e2a699c52789a0878b72489d89b2e3c4eb28d411a654c3c89c4b183d75723ac2
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: mcp-gateway-ext
  namespace: mcp-gateway-system
spec:
  httpRouteManagement: Enabled
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
    namespace: openshift-ingress
    sectionName: mcp

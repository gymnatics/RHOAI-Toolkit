apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-codebase-search
  namespace: mcp-servers
  labels:
    app: mcp-codebase-search
    app.kubernetes.io/part-of: code-assistant-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-codebase-search
  template:
    metadata:
      labels:
        app: mcp-codebase-search
    spec:
      containers:
      - name: codebase-search
        image: image-registry.openshift-image-registry.svc:5000/mcp-servers/mcp-codebase-search:latest
        imagePullPolicy: Always
        env:
        - name: SOURCE_DIR
          value: /data/source
        - name: EMBED_MODEL
          value: all-MiniLM-L6-v2
        ports:
        - containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 60
        volumeMounts:
        - name: source-code
          mountPath: /data/source
      volumes:
      - name: source-code
        configMap:
          name: cafe-source-code
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-codebase-search
  namespace: mcp-servers
  labels:
    app: mcp-codebase-search
spec:
  selector:
    app: mcp-codebase-search
  ports:
  - port: 8000
    protocol: TCP
    targetPort: 8000

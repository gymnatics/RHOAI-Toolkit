# MCPGatewayExtension CR - applied AFTER mcp-gateway-controller is running
# The controller registers the MCPGatewayExtension CRD at startup
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: mcp-gateway-ext
  namespace: mcp-gateway-system
spec:
  httpRouteManagement: Enabled
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
    namespace: openshift-ingress
    sectionName: mcp

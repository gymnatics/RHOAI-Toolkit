# OpenShift Console Links for Grafana Dashboards
# CLUSTER_DOMAIN is the base domain WITHOUT apps. prefix (e.g., openshift-cluster.sandbox.opentlc.com)
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: grafana-gpu-metrics
  labels:
    app: rhoai-toolkit
    component: monitoring
spec:
  applicationMenu:
    imageURL: data:image/svg+xml;base64,
    section: Monitoring
  href: https://grafana-monitoring.apps.${CLUSTER_DOMAIN}/d/gpu-dcgm-metrics/gpu-metrics-nvidia-dcgm
  location: ApplicationMenu
  text: "GPU Metrics (Grafana)"
---
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: grafana-vllm-metrics
  labels:
    app: rhoai-toolkit
    component: monitoring
spec:
  applicationMenu:
    imageURL: data:image/svg+xml;base64,
    section: Monitoring
  href: https://grafana-monitoring.apps.${CLUSTER_DOMAIN}/d/llm-vllm-metrics/llm-inference-vllm
  location: ApplicationMenu
  text: "vLLM Inference (Grafana)"

# OpenShift Console Links for Grafana Dashboards
# Usage: export CLUSTER_DOMAIN=apps.<cluster>.<domain> && envsubst < consolelinks-grafana.yaml | oc apply -f -
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: grafana-gpu-metrics
  labels:
    app: rhoai-toolkit
    component: monitoring
spec:
  applicationMenu:
    imageURL: data:image/svg+xml;base64,
    section: Monitoring
  href: https://grafana-monitoring.${CLUSTER_DOMAIN}/d/gpu-dcgm-metrics/gpu-metrics-nvidia-dcgm
  location: ApplicationMenu
  text: "GPU Metrics (Grafana)"

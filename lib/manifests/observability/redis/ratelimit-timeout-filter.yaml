# Increases the Kuadrant ratelimit-service cluster connect timeout from the
# Istio default (~100ms, too low under load) to 2s.
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: increase-ratelimit-cluster-timeout
  namespace: openshift-ingress
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  configPatches:
    - applyTo: CLUSTER
      match:
        context: GATEWAY
        cluster:
          name: kuadrant-ratelimit-service
      patch:
        operation: MERGE
        value:
          connect_timeout: 2s

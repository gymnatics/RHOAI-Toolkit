# MinIO S3-compatible object storage for the Loki usage-logging pipeline.
# NON-PRODUCTION: single replica, PVC-backed (not erasure-coded/HA). For
# production, replace with an ObjectBucketClaim (NooBaa/ODF) or a cloud S3
# bucket and update usage-logs-object-storage's endpoint/credentials instead.
#
# MINIO_DEFAULT_BUCKETS auto-creates the "loki" bucket on first startup --
# no separate bucket-creation Job needed.
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-usage-logs
  labels:
    app.kubernetes.io/name: minio-usage-logs
    app.kubernetes.io/component: storage
stringData:
  MINIO_ROOT_USER: loki
  MINIO_ROOT_PASSWORD: lokiminio123
  MINIO_DEFAULT_BUCKETS: loki
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-usage-logs-data
  labels:
    app.kubernetes.io/name: minio-usage-logs
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-usage-logs
  labels:
    app.kubernetes.io/name: minio-usage-logs
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio-usage-logs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-usage-logs
    spec:
      containers:
      - name: minio
        image: quay.io/minio/minio:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/bin/docker-entrypoint.sh
        - server
        - /data
        - "--console-address"
        - ":9001"
        envFrom:
        - secretRef:
            name: minio-usage-logs
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        - name: console
          containerPort: 9001
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-usage-logs-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio-usage-logs
  labels:
    app.kubernetes.io/name: minio-usage-logs
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  ports:
  - name: api
    port: 9000
    targetPort: api
    protocol: TCP
  - name: console
    port: 9001
    targetPort: console
    protocol: TCP
  selector:
    app.kubernetes.io/name: minio-usage-logs

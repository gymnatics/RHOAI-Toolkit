apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: redhat-ods-monitoring

# LokiStack for RHOAI 3.5+ MaaS usage-logging dashboards. The S3-compatible
# storage backend (SeaweedFS by default, or Ceph RGW/MinIO) is deployed
# separately via lib/functions/storage-backend.sh -- see
# lib/functions/usage-logging.sh for the orchestrating function, which also
# generates the Loki-specific storage secret from loki-s3-secret.yaml.tmpl
# and patches the Config CR to enable the feature (usageLogging: true),
# which triggers the RHOAI operator to auto-create the EnvoyFilter, OTEL
# Collector, Tenancy Proxy, and Perses Dashboards.
#
# Requires the Loki Operator (lib/manifests/observability/loki/) to be
# installed first.
#
# minio.yaml / minio-secret.yaml are kept in this directory for reference /
# --backend=minio compatibility but are no longer applied by default.
resources:
  - lokistack.yaml

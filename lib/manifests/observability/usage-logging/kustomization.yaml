apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: redhat-ods-monitoring

# MinIO (S3-compatible storage) + LokiStack for RHOAI 3.5+ MaaS usage-logging
# dashboards. Requires the Loki Operator (lib/manifests/observability/loki/)
# to be installed first. See lib/functions/usage-logging.sh for the
# orchestrating function that also patches the Config CR to enable the
# feature (usageLogging: true), which triggers the RHOAI operator to
# auto-create the EnvoyFilter, OTEL Collector, Tenancy Proxy, and Perses
# Dashboards.
resources:
  - minio.yaml
  - minio-secret.yaml
  - lokistack.yaml

# S3-compatible storage credentials for the Loki Operator (LokiStack
# spec.storage.secret). Must match minio.yaml's MINIO_ROOT_USER/PASSWORD and
# MINIO_DEFAULT_BUCKETS, and assumes minio-usage-logs is deployed in the SAME
# namespace as this secret (redhat-ods-monitoring) so the short service DNS
# name resolves.
---
apiVersion: v1
kind: Secret
metadata:
  name: usage-logs-object-storage
  labels:
    app.kubernetes.io/name: minio-usage-logs
    app.kubernetes.io/component: storage
stringData:
  access_key_id: loki
  access_key_secret: lokiminio123
  bucketnames: loki
  endpoint: http://minio-usage-logs.redhat-ods-monitoring.svc:9000
  region: us-east-1

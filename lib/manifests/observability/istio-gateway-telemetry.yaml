# Istio Telemetry CR for latency-per-subscription metrics on MaaS gateway
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: latency-per-subscription
  namespace: openshift-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: REQUEST_DURATION
            mode: SERVER
          tagOverrides:
            subscription:
              operation: UPSERT
              value: "request.headers['x-maas-subscription']"

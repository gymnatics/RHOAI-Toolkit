apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-provisioning
  namespace: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      isDefault: true
      jsonData:
        httpHeaderName1: Authorization
        tlsSkipVerify: true
        timeInterval: "5s"
      secureJsonData:
        httpHeaderValue1: "Bearer ${PROM_TOKEN}"
      editable: true

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: admin-workshop
  name: secret-reader-${USER_NAME}
  labels:
    purpose: workshop-prometheus-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
- kind: User
  name: ${USER_NAME}
  apiGroup: rbac.authorization.k8s.io

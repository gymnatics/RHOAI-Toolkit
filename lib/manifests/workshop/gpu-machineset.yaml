apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: ${INFRA_ID}-gpu-worker-${GPU_INSTANCE}-${AZ}
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: ${INFRA_ID}
  annotations:
    machine.openshift.io/GPU: "1"
    machine.openshift.io/memoryMb: "${MEM}"
    machine.openshift.io/vCPU: "${VCPU}"
spec:
  replicas: ${GPU_COUNT}
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: ${INFRA_ID}
      machine.openshift.io/cluster-api-machineset: ${INFRA_ID}-gpu-worker-${GPU_INSTANCE}-${AZ}
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: ${INFRA_ID}
        machine.openshift.io/cluster-api-machine-role: gpu-worker
        machine.openshift.io/cluster-api-machine-type: gpu-worker
        machine.openshift.io/cluster-api-machineset: ${INFRA_ID}-gpu-worker-${GPU_INSTANCE}-${AZ}
        node-role.kubernetes.io/gpu-worker: ""
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/gpu-worker: ""
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          ami:
            id: ${AMI_ID}
          instanceType: ${GPU_INSTANCE}
          placement:
            availabilityZone: ${AZ}
            region: ${REGION}
          credentialsSecret:
            name: aws-cloud-credentials
          iamInstanceProfile:
            id: ${INFRA_ID}-worker-profile
          securityGroups:
          - filters:
            - name: tag:Name
              values:
              - ${INFRA_ID}-node
          - filters:
            - name: tag:Name
              values:
              - ${INFRA_ID}-lb
          subnet:
            filters:
            - name: tag:Name
              values:
              - ${INFRA_ID}-subnet-private-${AZ}
          tags:
          - name: kubernetes.io/cluster/${INFRA_ID}
            value: owned
          blockDevices:
          - ebs:
              volumeSize: 100
              volumeType: gp2
              encrypted: true
          userDataSecret:
            name: worker-user-data
      taints:
      - key: nvidia.com/gpu
        effect: NoSchedule

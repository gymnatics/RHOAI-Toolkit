apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MetalLB operator subscription only -- the MetalLB CR and IPAddressPool/
# L2Advertisement are applied separately (see lib/functions/metallb.sh) since
# the operand requires the operator CSV to succeed first, and the IP pool
# requires runtime-derived values (envsubst on ip-pool.yaml.tmpl).
resources:
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml

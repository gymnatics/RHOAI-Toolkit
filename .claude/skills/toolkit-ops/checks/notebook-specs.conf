# notebook-specs.conf -- demo notebooks inside RHOAI workbenches (read by check-notebooks.sh)
#
# Format: demo | namespace | workbench | notebook (path under /opt/app-root/src/RHOAI-Toolkit) | env | imports | class
#   env      comma list of env vars the notebook reads (must be in the pod env, not just the ConfigMap)
#   imports  comma list of Python modules that must import in the workbench image
#            (prefix "pip:" = notebook pip-installs it itself, so a missing module is only INFO)
#   class    what --execute does:
#              safe        runs with --execute (short, CPU, no secrets)
#              needs-key   runs only if the listed key env var is set (e.g. needs-key:MAAS_API_KEY)
#              needs-data  needs data the deploy does not provide; runs only with --force
#              long        > 10 min; runs only with --force
#              gpu         needs GPU + Hugging Face downloads; never auto-run
#              broken      known defect (reason after ':'); never auto-run, reported as WARN
#
# Delivery: every workbench clones https://github.com/gymnatics/RHOAI-Toolkit (main) into
# /opt/app-root/src/RHOAI-Toolkit (lib/functions/workbench.sh clone_repo_in_workbench).
# Facts and file:line evidence: reference/demo-checks.md "Notebooks".

feast-demo | ${FEAST_NS:-feast-demo} | feature-store | demo/feast-demo/notebooks/feast-online-retrieval.ipynb | NAMESPACE,FEAST_PROJECT,FEAST_NAME | feast | safe
feast-demo | ${FEAST_NS:-feast-demo} | feature-store | demo/feast-demo/notebooks/feast-banking-complex.ipynb  | NAMESPACE,FEAST_PROJECT,FEAST_NAME | feast | safe


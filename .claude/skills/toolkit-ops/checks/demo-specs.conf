# demo-specs.conf -- what "deployed correctly" means for each demo (read by check-demos.sh)
#
# Format: demo | namespace | check | target | condition
#   namespace : "-" for cluster-scoped; "$FEAST_NS" style vars are expanded from the environment
#   check     : deploy  NAME|*     Deployment(s) readyReplicas == replicas  (* = every Deployment in ns)
#               isvc    NAME|*     InferenceService Ready=True               (* = any one Ready)
#               llmisvc NAME|*     LLMInferenceService Ready=True
#               notebook NAME      workbench Notebook exists + pod NAME-0 Ready (deep checks: check-notebooks.sh)
#               route   NAME[/path] HTTP GET via the Route host -> 2xx/3xx/401/403
#               exists  KIND/NAME  resource exists
#               field   KIND/NAME  jsonpath=value must match (e.g. .status.phase=Ready)
#               servedmodel configmap/NAME  KEY (5th field, default LLM_MODEL_NAME) must hold a model id
#                          that is actually served (LLMInferenceService spec.model.name / ISVC name)
#   condition : optional version gate, "rhoai>=3.5" or "rhoai<3.5"
#
# The first row of each demo decides whether the demo is "deployed": if it fails because the namespace
# or resource is absent, the whole demo is SKIPPED (unless requested explicitly with --demo).
# Sources: deploy.sh of each demo (file:line in reference/demo-checks.md) + rhoai-version-bump/demo-test-matrix.md.


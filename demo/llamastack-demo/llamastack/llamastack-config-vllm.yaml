---
# LlamaStack ConfigMap - vLLM Provider (OpenShift/RHOAI)
# Use this when you have a model served via RHOAI KServe/vLLM
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    llamastack.io/distribution: llamastack-demo
    opendatahub.io/dashboard: "true"
  name: llamastack-demo-config
  namespace: NAMESPACE_PLACEHOLDER
data:
  run.yaml: |
    version: "2"
    image_name: rh
    apis:
    - inference
    - tool_runtime
    providers:
      inference:
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config: {}
      - provider_id: vllm-inference
        provider_type: remote::vllm
        config:
          api_token: ${env.VLLM_API_TOKEN:}
          max_tokens: ${env.VLLM_MAX_TOKENS:4096}
          base_url: ${env.VLLM_URL}/v1
      tool_runtime:
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
    connectors:
    - connector_id: weather-data
      connector_type: mcp
      url: http://weather-mcp-server.NAMESPACE_PLACEHOLDER.svc.cluster.local:8000/mcp
    metadata_store:
      type: sqlite
      db_path: /opt/app-root/src/.llama/distributions/rh/inference_store.db
    models:
    - provider_id: vllm-inference
      model_id: MODEL_ID_PLACEHOLDER
      provider_model_id: MODEL_ID_PLACEHOLDER
      model_type: llm
      metadata:
        display_name: MODEL_ID_PLACEHOLDER
    shields: []
    server:
      port: 8321

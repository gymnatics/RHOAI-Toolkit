---
apiVersion: v1
kind: Secret
metadata:
  name: llamastack-postgres-secret
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  password: llamastack123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llamastack-postgres-pvc
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamastack-postgres
  namespace: ${NAMESPACE}
  labels:
    app: llamastack-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamastack-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llamastack-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: llamastack
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llamastack-postgres-secret
                  key: password
            - name: POSTGRESQL_DATABASE
              value: llamastack
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: llamastack-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llamastack-postgres
  namespace: ${NAMESPACE}
spec:
  selector:
    app: llamastack-postgres
  ports:
    - port: 5432
      targetPort: 5432

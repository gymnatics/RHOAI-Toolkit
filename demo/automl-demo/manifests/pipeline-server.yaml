# DataSciencePipelineApplication for AutoML
# AutoML uses Kubeflow Pipelines + AutoGluon to train/compare models.
# The pipeline server must be configured in the project namespace.
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: pipelines-definition
  namespace: ${NAMESPACE}
spec:
  apiServer:
    deploy: true
  persistenceAgent:
    deploy: true
  scheduledWorkflow:
    deploy: true
  objectStorage:
    externalStorage:
      bucket: pipeline-artifacts
      # Rendered from the active storage backend by deploy.sh (get_storage_endpoint):
      # SeaweedFS -> seaweedfs-s3.<ns>.svc:8333, MinIO -> minio.<ns>.svc:9000, Ceph RGW -> OBC host.
      host: ${S3_HOST}
      port: "${S3_PORT}"
      region: us-east-1
      s3CredentialsSecret:
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
        secretName: pipelines-s3-credentials
      scheme: ${S3_SCHEME}

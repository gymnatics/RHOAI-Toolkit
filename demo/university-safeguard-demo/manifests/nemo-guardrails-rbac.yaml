# NeMo Guardrails RBAC
# Grants the SA view permissions to discover and communicate with model endpoints
# (main LLM predictor + HAP detector predictor) in the same namespace.
#
# Usage:
#   export NAMESPACE=acme-university-demo
#   envsubst < nemo-guardrails-rbac.yaml | oc apply -f -
#
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nemo-guardrails-service-account-view
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: nemo-guardrails-service-account
    namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view

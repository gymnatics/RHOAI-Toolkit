    .typing{align-self:flex-start;color:#888;font-style:italic;font-size:13px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    pre{white-space:pre-wrap;word-break:break-word}
    #login-overlay{position:fixed;inset:0;background:#151515;display:flex;align-items:center;justify-content:center;z-index:999}
    #login-overlay .msg{font-size:16px;color:#999}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/keycloak-js@25/dist/keycloak.min.js"></script>
    </head>
    <body>
    <div id="login-overlay"><div class="msg">Authenticating with DBS Identity Service...</div></div>
    <div class="header">
      <svg width="28" height="28" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#ee0000"/><text x="50" y="65" text-anchor="middle" fill="white" font-size="40" font-weight="bold">L</text></svg>
      <h1>DBS Loan Processing Agent<span class="badge">LIVE</span></h1>
      <div class="user-info">
        <span class="username" id="user-display"></span>
        <span class="role-badge" id="role-display"></span>
        <button class="logout-btn" onclick="keycloak.logout()">Logout</button>
      </div>
    </div>
    <div class="chat-area" id="chat">
      <div class="msg agent">Welcome to DBS Loan Processing. I can help you with home loans, personal loans, and renovation loans. Ask me anything — for example: <em>"I want a $500K home loan over 25 years"</em></div>
    </div>
    <div class="input-area">
      <input id="input" placeholder="Ask about loans..." autofocus>
      <button id="send" onclick="sendMessage()">Send</button>
    </div>
    <script>
    const KC_URL = 'https://keycloak-keycloak.__CLUSTER_DOMAIN__';
    const KC_REALM = 'kagenti';
    const KC_CLIENT = 'loan-agent-ui';

    const keycloak = new Keycloak({ url: KC_URL, realm: KC_REALM, clientId: KC_CLIENT });

    function doLogin() {
      keycloak.init({ onLoad: 'login-required', checkLoginIframe: false }).then(authenticated => {
        if (!authenticated) { keycloak.login(); return; }
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        const user = keycloak.tokenParsed.preferred_username || 'user';
        const groups = keycloak.tokenParsed.groups || [];
        const role = groups.find(g => ['senior-rm','rm','teller'].includes(g)) || 'unknown';
        document.getElementById('user-display').textContent = user;
        const roleBadge = document.getElementById('role-display');
        roleBadge.textContent = role;
        roleBadge.classList.add(role);
        setInterval(() => { keycloak.updateToken(30).catch(() => keycloak.login()); }, 30000);
      }).catch(err => {
        console.error('Keycloak init error:', err);
        console.log('Authentication failed — check Keycloak URL and client config.');
      });
    }
    doLogin();

    const chat=document.getElementById('chat'),input=document.getElementById('input'),btn=document.getElementById('send');
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});

    async function sendMessage(){
      const msg=input.value.trim();if(!msg)return;
      input.value='';btn.disabled=true;
      appendMsg('user',msg);
      const typing=document.createElement('div');typing.className='typing';typing.textContent='Agent is processing...';chat.appendChild(typing);chat.scrollTop=chat.scrollHeight;
      try{
        await keycloak.updateToken(5);
        const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+keycloak.token},body:JSON.stringify({message:msg})});
        const data=await resp.json();
        typing.remove();
        let html='';
        if(data.tool_calls&&data.tool_calls.length>0){
          html+='<div style="margin-bottom:10px;font-size:12px;color:#888">Tool calls:</div>';
          data.tool_calls.forEach(tc=>{
            const cls=tc.status==='SUCCESS'?'success':tc.status==='DENIED'?'denied':'error';
            const icon=tc.status==='SUCCESS'?'&#10003;':tc.status==='DENIED'?'&#10007;':'&#9888;';
            html+=`<div class="tool-call ${cls}">${icon} <strong>${tc.tool}</strong>(${JSON.stringify(tc.args||{})}) &rarr; ${tc.status}`;
            if(tc.reasons)html+=` &mdash; ${tc.reasons.join('; ')}`;
            html+='</div>';
          });
          html+='<hr style="border-color:#333;margin:12px 0">';
        }
        html+=`<div>${formatResponse(data.response||data.error||'No response')}</div>`;
        appendMsg('agent',html,true);
      }catch(e){typing.remove();appendMsg('agent','Error: '+e.message,true)}
      btn.disabled=false;input.focus();
    }

    function appendMsg(role,content,isHtml){
      const div=document.createElement('div');div.className='msg '+role;
      if(isHtml)div.innerHTML=content;else div.textContent=content;
      chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
    }

    function formatResponse(text){return text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}
    </script>
    </body>
    </html>

---
# ============================================================================
# LAYER 4+5: Loan Agent Deployment (agent + OPA + policy-sync)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-agent
  namespace: team1
  labels:
    app: loan-agent
    kagenti.io/inject: disabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-agent
  template:
    metadata:
      labels:
        app: loan-agent
        kagenti.io/inject: disabled
    spec:
      serviceAccountName: loan-agent
      containers:
      # Container 1: The Agent
      - name: agent
        image: registry.access.redhat.com/ubi9/python-311:latest
        command: ["sh", "-c", "pip install -q urllib3 && python /app/agent.py"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AGENT_NAME
          value: loan-agent
        - name: AGENT_TITLE
          value: "DBS Loan Processing Agent"
        - name: PORT
          value: "8080"
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-key
              key: api-key
        - name: DEEPSEEK_BASE_URL
          value: "https://maas.__CLUSTER_DOMAIN__/model-storage/qwen35-35b-a3b/v1"
        - name: DEEPSEEK_MODEL
          value: "qwen35-35b-a3b"
        - name: MCP_GATEWAY_URL
          value: "http://mcp-gateway-istio.mcp-system.svc.cluster.local:8080/mcp"
        - name: MCP_HOST_HEADER
          value: "mcp-gateway-mcp-system.__CLUSTER_DOMAIN__"
        - name: OIDC_TOKEN_URL
          value: "https://keycloak-keycloak.__CLUSTER_DOMAIN__/realms/kagenti/protocol/openid-connect/token"
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: loan-agent-oidc
              key: client-id
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: loan-agent-oidc
              key: client-secret
        - name: OPA_URL
          value: "http://localhost:8181"
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: ui
          mountPath: /ui
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30

      # Container 2: OPA (policy evaluation engine)
      - name: opa
        image: openpolicyagent/opa:0.70.0-static
        args:
        - "run"
        - "--server"
        - "--addr=:8181"
        - "/policies"
        ports:
        - containerPort: 8181
          name: opa
        volumeMounts:
        - name: opa-policies
          mountPath: /policies/authz.rego
          subPath: authz.rego
          readOnly: true
        - name: opa-policies
          mountPath: /policies/client_rbac.rego
          subPath: client_rbac.rego
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8181
          initialDelaySeconds: 5
          periodSeconds: 10

      # Container 3: Policy Sync — DISABLED (CRDs not available without KAgenti operator)
      # Policies are loaded directly from ConfigMap into OPA via volume mounts above.
      - name: policy-sync
        image: registry.access.redhat.com/ubi9/python-311:latest
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi

      volumes:
      - name: app-code
        configMap:
          name: loan-agent-app
      - name: ui
        configMap:
          name: loan-agent-ui
      - name: opa-base
        configMap:
          name: loan-agent-opa-base
      - name: opa-policies
        configMap:
          name: loan-agent-opa-base

---
apiVersion: v1
kind: Service
metadata:
  name: loan-agent
  namespace: team1
spec:
  selector:
    app: loan-agent
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: loan-agent
  namespace: team1
spec:
  to:
    kind: Service
    name: loan-agent
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# ============================================================================
# AgentRuntime CRD (Kagenti discovery - inject disabled)
# ============================================================================
apiVersion: agent.kagenti.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: loan-agent
  namespace: team1
  labels:
    kagenti.io/framework: custom
    kagenti.io/inject: disabled
spec:
  type: agent
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loan-agent

---
# ============================================================================
# RBAC Policy: Role-Based Tool Access Control
# ============================================================================
apiVersion: agent.kagenti.dev/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: loan-agent-tool-allowlist
  namespace: team1
  annotations:
    policy.kagenti.dev/description: "Role-based tool access — tellers get credit checks only, RMs add KYC/calc, Senior RMs get full access including notifications"
    policy.kagenti.dev/created-by: "System (RBAC)"
    policy.kagenti.dev/created-at: "2026-07-19T14:30:00+08:00"
    policy.kagenti.dev/status: "active"
    policy.kagenti.dev/version: "3"
    policy.kagenti.dev/affected-agents: '["loan-agent"]'
    policy.kagenti.dev/affected-tools: '["loan_credit_credit_check", "loan_credit_credit_score", "loan_kyc_kyc_verify", "loan_kyc_pep_screen", "loan_calc_loan_calculate", "loan_calc_affordability_check", "loan_notify_send_notification", "loan_notify_send_approval_letter"]'
spec:
  clientID: loan-agent
  scope: client
  policies:
  - path: client/loan_agent_rbac.rego
    content: |
      package kagenti.client.loan_agent_rbac
      import rego.v1

      default allow := false

      teller_tools := {"loan_credit_credit_check", "loan_credit_credit_score"}

      rm_tools := teller_tools | {"loan_kyc_kyc_verify", "loan_kyc_pep_screen",
          "loan_calc_affordability_check", "loan_calc_loan_calculate"}

      senior_rm_tools := rm_tools | {"loan_notify_send_notification",
          "loan_notify_send_approval_letter"}

      role_tools := {
          "teller": teller_tools,
          "rm": rm_tools,
          "senior-rm": senior_rm_tools,
      }

      user_role := role if {
          some role in input.groups
          role in {"teller", "rm", "senior-rm"}
      }

      allow if {
          input.tool in role_tools[user_role]
      }

      deny contains msg if {
          not allow
          msg := sprintf("Role '%s' is not authorized to use tool '%s'. Contact a Senior RM.", [user_role, input.tool])
      }

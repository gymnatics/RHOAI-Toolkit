data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DBS Loan Agent</title>
    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Red Hat Display','Segoe UI',sans-serif;background:#151515;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}

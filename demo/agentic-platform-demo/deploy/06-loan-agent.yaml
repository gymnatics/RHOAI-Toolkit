###############################################################################
# DBS Loan Agent - Full E2E with MCP Gateway, OIDC, OPA Policy Enforcement
# Layers: Tool Servers → HTTPRoutes → MCPServerRegistrations → AuthPolicy →
#         Agent (DeepSeek + MCP + OPA PEP) → OPA Sidecar → Policy Sync
###############################################################################

---
# ============================================================================
# LAYER 2: MCP Tool Servers (FastMCP, env-driven toolset)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-tools-server
  namespace: team1
data:
  server.py: |
    import os
    from mcp.server.fastmcp import FastMCP

    TOOLSET = os.getenv("TOOLSET", "credit").lower()
    MCP_NAME = os.getenv("MCP_NAME", f"loan-tools-{TOOLSET}")
    mcp = FastMCP(MCP_NAME, host="0.0.0.0", port=int(os.getenv("PORT", "8000")))

    # ─── Credit tools ───────────────────────────────────────────────────────
    def _register_credit():
        SCORES = {
            "C1001": {"name": "Alice Tan", "score": 780, "grade": "A", "history_years": 12},
            "C1002": {"name": "Bob Lim", "score": 650, "grade": "B", "history_years": 5},
            "C1003": {"name": "Charlie Wong", "score": 520, "grade": "C", "history_years": 2},
            "C1004": {"name": "Diana Chen", "score": 810, "grade": "A+", "history_years": 18},
        }

        @mcp.tool()
        def credit_check(customer_id: str) -> dict:
            """Run a credit bureau check for a customer. Returns credit score, grade, and history length."""
            record = SCORES.get(customer_id.upper())
            if not record:
                return {"error": f"Customer {customer_id} not found in credit bureau"}
            return {"customer_id": customer_id, **record, "bureau": "CBS Singapore", "as_of": "2026-07-19"}

        @mcp.tool()
        def credit_score(customer_id: str) -> dict:
            """Get just the numeric credit score for quick decisioning."""
            record = SCORES.get(customer_id.upper())
            if not record:
                return {"error": f"No score for {customer_id}"}
            return {"customer_id": customer_id, "score": record["score"], "grade": record["grade"]}

    # ─── KYC tools ──────────────────────────────────────────────────────────
    def _register_kyc():
        PEP_LIST = {"kim po", "ivan petrov", "general aung", "raja ahmad"}

        @mcp.tool()
        def kyc_verify(doc_type: str, doc_id: str) -> dict:
            """Verify a customer identity document (passport, NRIC, driver license)."""
            valid = len(doc_id.strip()) >= 7
            return {
                "doc_type": doc_type,
                "doc_id": doc_id,
                "status": "VERIFIED" if valid else "REJECTED",
                "reason": "Document validated against MAS registry" if valid else "Document ID format invalid (min 7 chars)",
                "verification_date": "2026-07-19",
            }

        @mcp.tool()
        def pep_screen(name: str) -> dict:
            """Screen a person against the Politically Exposed Persons (PEP) database."""
            hit = name.strip().lower() in PEP_LIST
            return {
                "name": name,
                "pep_hit": hit,
                "risk_level": "HIGH" if hit else "STANDARD",
                "recommendation": "Enhanced Due Diligence required — escalate to compliance" if hit else "Standard due diligence sufficient",
                "database": "MAS PEP Registry",
            }

    # ─── Loan calculation tools ─────────────────────────────────────────────
    def _register_calc():
        CUSTOMERS = {
            "C1001": {"income_monthly": 18000, "existing_obligations": 2500},
            "C1002": {"income_monthly": 8500, "existing_obligations": 1200},
            "C1003": {"income_monthly": 5000, "existing_obligations": 800},
            "C1004": {"income_monthly": 25000, "existing_obligations": 3000},
        }

        @mcp.tool()
        def loan_calculate(amount: float, tenure_months: int, rate: float = 3.5) -> dict:
            """Calculate monthly repayment, total interest, and total cost for a loan."""
            monthly_rate = rate / 100 / 12
            if monthly_rate == 0:
                monthly_payment = amount / tenure_months
            else:
                monthly_payment = amount * (monthly_rate * (1 + monthly_rate) ** tenure_months) / ((1 + monthly_rate) ** tenure_months - 1)
            total_paid = monthly_payment * tenure_months
            total_interest = total_paid - amount
            return {
                "principal": amount,
                "tenure_months": tenure_months,
                "annual_rate_pct": rate,
                "monthly_payment": round(monthly_payment, 2),
                "total_interest": round(total_interest, 2),
                "total_cost": round(total_paid, 2),
                "currency": "SGD",
            }

        @mcp.tool()
        def affordability_check(customer_id: str, amount: float, tenure_months: int = 240) -> dict:
            """Check if a customer can afford a loan based on MAS TDSR (Total Debt Servicing Ratio) of 55%."""
            customer = CUSTOMERS.get(customer_id.upper())
            if not customer:
                return {"error": f"Customer {customer_id} not found"}
            monthly_rate = 3.5 / 100 / 12
            monthly_payment = amount * (monthly_rate * (1 + monthly_rate) ** tenure_months) / ((1 + monthly_rate) ** tenure_months - 1)
            total_obligations = customer["existing_obligations"] + monthly_payment
            tdsr = total_obligations / customer["income_monthly"]
            affordable = tdsr <= 0.55
            return {
                "customer_id": customer_id,
                "monthly_income": customer["income_monthly"],
                "existing_obligations": customer["existing_obligations"],
                "new_monthly_payment": round(monthly_payment, 2),
                "tdsr_ratio": round(tdsr, 4),
                "tdsr_limit": 0.55,
                "affordable": affordable,
                "verdict": "APPROVED — within TDSR limit" if affordable else "REJECTED — exceeds MAS TDSR limit of 55%",
            }

    # ─── Notification tools ─────────────────────────────────────────────────
    def _register_notify():
        @mcp.tool()
        def send_notification(customer_id: str, message: str) -> dict:
            """Send a notification (SMS/email) to a customer about their loan application."""
            return {
                "customer_id": customer_id,
                "channel": "SMS + Email",
                "status": "SENT",
                "message_preview": message[:80],
                "timestamp": "2026-07-19T12:00:00+08:00",
            }

        @mcp.tool()
        def send_approval_letter(customer_id: str, loan_id: str) -> dict:
            """Generate and send an official loan approval letter to the customer."""
            return {
                "customer_id": customer_id,
                "loan_id": loan_id,
                "letter_type": "Loan Approval",
                "delivery": "Registered mail + Digital copy via DBS Digital Banking",
                "status": "GENERATED_AND_QUEUED",
                "estimated_delivery": "2026-07-22",
            }

    REGISTRY = {"credit": _register_credit, "kyc": _register_kyc, "calc": _register_calc, "notify": _register_notify}
    REGISTRY.get(TOOLSET, _register_credit)()

    if __name__ == "__main__":
        import uvicorn

        inner_app = mcp.streamable_http_app()

        async def app(scope, receive, send):
            if scope["type"] in ("http", "websocket"):
                path = scope.get("path", "")
                if not path.startswith("/mcp"):
                    new_path = "/mcp" if path == "/" else "/mcp" + path
                    scope = dict(scope, path=new_path, raw_path=new_path.encode())
            await inner_app(scope, receive, send)

        uvicorn.run(app, host="0.0.0.0", port=int(os.getenv("PORT", "8000")))

---
# Tool Server Deployments (one per toolset)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-tools-credit
  namespace: team1
  labels:
    app: loan-tools-credit
    kagenti.io/type: tool
    kagenti.io/protocol: streamable_http
    kagenti.io/framework: Python
  annotations:
    kagenti.io/description: "Credit bureau check and scoring service"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-tools-credit
  template:
    metadata:
      labels:
        app: loan-tools-credit
    spec:
      containers:
      - name: server
        image: registry.access.redhat.com/ubi9/python-311:latest
        command: ["sh", "-c", "pip install -q fastmcp uvicorn starlette && python /app/server.py"]
        env:
        - name: TOOLSET
          value: credit
        - name: MCP_NAME
          value: loan-tools-credit
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: code
        configMap:
          name: loan-tools-server
---

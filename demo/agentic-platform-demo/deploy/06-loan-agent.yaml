# ============================================================================
# LAYER 3: Gateway Auth - REMOVED
# JWT enforcement moved to OPA sidecar layer to avoid blocking Kagenti UI
# tool discovery (tools/list). Agent-level OPA PEP validates identity and
# enforces fine-grained policies on every tool call.
# ============================================================================

---
# ============================================================================
# LAYER 5: OPA Base Policy (root decision package)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-agent-opa-base
  namespace: team1
data:
  authz.rego: |
    package kagenti.authz
    import rego.v1

    default decision := {"allow": true, "reasons": []}

    decision := {"allow": false, "reasons": deny_reasons} if {
        count(deny_reasons) > 0
    }

    deny_reasons contains msg if {
        some pkg_name
        pkg := data.kagenti.client[pkg_name]
        some msg in pkg.deny
    }

    deny_reasons contains msg if {
        some pkg_name
        pkg := data.kagenti.namespace[pkg_name]
        some msg in pkg.deny
    }

    deny_reasons contains msg if {
        some pkg_name
        pkg := data.kagenti.global[pkg_name]
        some msg in pkg.deny
    }
  client_rbac.rego: |
    package kagenti.client.loan_agent_rbac
    import rego.v1

    default allow := false

    teller_tools := {"loan_credit_credit_check", "loan_credit_credit_score"}

    rm_tools := teller_tools | {"loan_kyc_kyc_verify", "loan_kyc_pep_screen",
        "loan_calc_affordability_check", "loan_calc_loan_calculate"}

    senior_rm_tools := rm_tools | {"loan_notify_send_notification",
        "loan_notify_send_approval_letter"}

    role_tools := {
        "teller": teller_tools,
        "rm": rm_tools,
        "senior-rm": senior_rm_tools,
    }

    user_role := role if {
        some role in input.groups
        role in {"teller", "rm", "senior-rm"}
    }

    allow if {
        input.tool in role_tools[user_role]
    }

    deny contains msg if {
        not allow
        msg := sprintf("Role '%s' is not authorized to use tool '%s'. Contact a Senior RM.", [user_role, input.tool])
    }

---
# ============================================================================
# LAYER 5: Policy Sync Script
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-agent-policy-sync
  namespace: team1
data:
  sync.py: |
    import json
    import os
    import time
    import hashlib
    import urllib.request
    import ssl

    SYNC_INTERVAL = int(os.getenv("SYNC_INTERVAL", "10"))
    NAMESPACE = os.getenv("NAMESPACE", "team1")
    AGENT_NAME = os.getenv("AGENT_NAME", "loan-agent")
    OPA_URL = os.getenv("OPA_URL", "http://localhost:8181")

    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    API_SERVER = "https://kubernetes.default.svc"

    _policy_hashes = {}
    _active_policies = set()

    def _k8s_get(path):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        req = urllib.request.Request(
            f"{API_SERVER}{path}",
            headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
        )
        with urllib.request.urlopen(req, context=ctx) as resp:
            return json.loads(resp.read())

    def _opa_put_policy(policy_id, rego_content):
        content_hash = hashlib.sha256(rego_content.encode()).hexdigest()
        if _policy_hashes.get(policy_id) == content_hash:
            return False
        req = urllib.request.Request(
            f"{OPA_URL}/v1/policies/{policy_id}",
            data=rego_content.encode(),
            headers={"Content-Type": "text/plain"},
            method="PUT",
        )
        try:
            with urllib.request.urlopen(req, timeout=5) as resp:
                resp.read()
            _policy_hashes[policy_id] = content_hash
            print(f"[policy-sync] Loaded policy: {policy_id}")
            return True
        except Exception as e:
            print(f"[policy-sync] OPA PUT {policy_id} failed: {e}")
            return False

    def _opa_delete_policy(policy_id):
        req = urllib.request.Request(
            f"{OPA_URL}/v1/policies/{policy_id}",
            method="DELETE",
        )
        try:
            with urllib.request.urlopen(req, timeout=5) as resp:
                resp.read()
            _policy_hashes.pop(policy_id, None)
            print(f"[policy-sync] Deleted policy: {policy_id}")
            return True
        except Exception as e:
            print(f"[policy-sync] OPA DELETE {policy_id} failed: {e}")
            return False

    def sync_policies():
        global _active_policies
        changed = False
        try:
            data = _k8s_get(f"/apis/agent.kagenti.dev/v1alpha1/namespaces/{NAMESPACE}/authorizationpolicies")
            items = data.get("items", [])
        except Exception as e:
            print(f"[policy-sync] Error fetching namespace policies: {e}")
            items = []

        current_policies = set()
        for item in items:
            spec = item.get("spec", {})
            scope = spec.get("scope", "namespace")
            client_id = spec.get("clientID", "")

            if scope == "client" and client_id and client_id != AGENT_NAME:
                continue

            for policy in spec.get("policies", []):
                rego_path = policy.get("path", "")
                content = policy.get("content", "")
                if rego_path and content:
                    policy_id = rego_path.replace("/", "_").replace(".rego", "")
                    current_policies.add(policy_id)
                    if _opa_put_policy(policy_id, content):
                        changed = True

        # Delete policies that no longer exist in CRDs
        stale = _active_policies - current_policies - {"authz"}
        for policy_id in stale:
            if _opa_delete_policy(policy_id):
                changed = True

        _active_policies = current_policies | {"authz"}

        # Load base authz.rego
        base_src = "/opa-base/authz.rego"
        if os.path.exists(base_src):
            with open(base_src) as f:
                base_content = f.read()
            if _opa_put_policy("authz", base_content):
                changed = True

        if changed:
            print(f"[policy-sync] Policies refreshed")
        return changed

    if __name__ == "__main__":
        print(f"[policy-sync] Starting: interval={SYNC_INTERVAL}s, namespace={NAMESPACE}, agent={AGENT_NAME}")
        print(f"[policy-sync] OPA endpoint: {OPA_URL}")
        # Wait for OPA to be ready
        for _ in range(30):
            try:
                req = urllib.request.Request(f"{OPA_URL}/health")
                with urllib.request.urlopen(req, timeout=2) as r:
                    if r.status == 200:
                        print("[policy-sync] OPA is ready")
                        break
            except Exception:
                pass
            time.sleep(1)
        # Initial sync
        sync_policies()
        while True:
            time.sleep(SYNC_INTERVAL)
            try:
                sync_policies()
            except Exception as e:
                print(f"[policy-sync] Error: {e}")

---
# ============================================================================
# LAYER 4: Loan Agent Application Code
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-agent-app
  namespace: team1
data:
  agent.py: |
    import json
    import os
    import time
    import uuid
    import ssl
    import urllib.request
    import urllib.parse
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from threading import Lock

    AGENT_NAME = os.getenv("AGENT_NAME", "loan-agent")
    AGENT_TITLE = os.getenv("AGENT_TITLE", "DBS Loan Processing Agent")
    PORT = int(os.getenv("PORT", "8080"))

    DEEPSEEK_API_KEY = os.getenv("DEEPSEEK_API_KEY", "")
    DEEPSEEK_BASE_URL = os.getenv("DEEPSEEK_BASE_URL", "https://api.deepseek.com")
    DEEPSEEK_MODEL = os.getenv("DEEPSEEK_MODEL", "deepseek-chat")

    MCP_GATEWAY_URL = os.getenv("MCP_GATEWAY_URL", "http://mcp-gateway-istio.mcp-system.svc.cluster.local:8080/mcp")
    MCP_HOST_HEADER = os.getenv("MCP_HOST_HEADER", "mcp-gateway-mcp-system.__CLUSTER_DOMAIN__")

    OIDC_TOKEN_URL = os.getenv("OIDC_TOKEN_URL", "https://keycloak-keycloak.__CLUSTER_DOMAIN__/realms/kagenti/protocol/openid-connect/token")
    OIDC_CLIENT_ID = os.getenv("OIDC_CLIENT_ID", "loan-agent")
    OIDC_CLIENT_SECRET = os.getenv("OIDC_CLIENT_SECRET", "")

    OPA_URL = os.getenv("OPA_URL", "http://localhost:8181")
    OPA_DECISION_PATH = os.getenv("OPA_DECISION_PATH", "/v1/data/kagenti/authz/decision")

    SYSTEM_PROMPT = (
        "You are the DBS Loan Processing Agent for DBS Bank Singapore. "
        "CRITICAL RULES: "
        "1) When a customer provides a loan request with a customer ID, IMMEDIATELY call tools. Do NOT ask follow-up questions. "
        "2) Execute the FULL pipeline automatically - credit_check, kyc_verify, affordability_check, loan_calculate, send_notification. "
        "3) If the customer says C1001 or similar, that IS the customer_id. Use it directly. "
        "4) For KYC, use doc_type=NRIC and doc_id=S+customer_id+A (e.g. SC1001A) unless they provide a real document. "
        "5) For affordability_check, use monthly_income=10000 as default if not specified. "
        "6) NEVER ask clarifying questions when you have enough info to proceed. A customer ID + loan amount is enough. "
        "PIPELINE (run all steps automatically): "
        "Step 1: loan_credit_credit_check(customer_id) - check creditworthiness. "
        "Step 2: loan_kyc_kyc_verify(doc_type=NRIC, doc_id=derived) - verify identity. "
        "Step 3: loan_calc_affordability_check(monthly_income, monthly_debt=0, loan_amount, interest_rate=3.5, tenure_years) - MAS TDSR check. "
        "Step 4: loan_calc_loan_calculate(principal, annual_rate=3.5, tenure_years) - compute repayments. "
        "Step 5: loan_notify_send_notification(customer_id, message=summary) - notify customer. "
        "If a tool call is DENIED by policy, explain the denial reason clearly and stop that step. "
        "Be concise and professional. All amounts in SGD."
    )

    # ─── OIDC Token Cache ────────────────────────────────────────────────────
    _token_cache = {"token": None, "expires_at": 0}
    _token_lock = Lock()

    def _get_oidc_token():
        with _token_lock:
            if _token_cache["token"] and time.time() < _token_cache["expires_at"] - 30:
                return _token_cache["token"]
            data = urllib.parse.urlencode({
                "grant_type": "client_credentials",
                "client_id": OIDC_CLIENT_ID,
                "client_secret": OIDC_CLIENT_SECRET,
            }).encode()
            ctx = ssl.create_default_context()
            ctx.check_hostname = False
            ctx.verify_mode = ssl.CERT_NONE
            req = urllib.request.Request(OIDC_TOKEN_URL, data=data, headers={"Content-Type": "application/x-www-form-urlencoded"})
            with urllib.request.urlopen(req, context=ctx) as resp:
                result = json.loads(resp.read())
            _token_cache["token"] = result["access_token"]
            _token_cache["expires_at"] = time.time() + result.get("expires_in", 300)
            print(f"[oidc] Token acquired, expires_in={result.get('expires_in')}s")
            return _token_cache["token"]

    # ─── MCP Gateway Client ─────────────────────────────────────────────────
    _mcp_session_id = None

    def _mcp_request(method, params=None):
        global _mcp_session_id
        token = _get_oidc_token()
        payload = {"jsonrpc": "2.0", "id": str(uuid.uuid4()), "method": method}
        if params:
            payload["params"] = params
        body = json.dumps(payload).encode()
        headers = {
            "Content-Type": "application/json",
            "Accept": "application/json, text/event-stream",
            "Authorization": f"Bearer {token}",
            "Host": MCP_HOST_HEADER,
        }
        if _mcp_session_id:
            headers["Mcp-Session-Id"] = _mcp_session_id
        ctx = ssl.create_default_context()
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE
        req = urllib.request.Request(MCP_GATEWAY_URL, data=body, headers=headers, method="POST")
        with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
            resp_headers = dict(resp.headers)
            if "mcp-session-id" in resp_headers:
                _mcp_session_id = resp_headers["mcp-session-id"]
            raw = resp.read().decode()
            # Handle SSE responses
            if "text/event-stream" in resp_headers.get("content-type", ""):
                for line in raw.split("\n"):
                    if line.startswith("data: "):
                        return json.loads(line[6:])
                return json.loads(raw)
            return json.loads(raw)

    def _mcp_initialize():
        result = _mcp_request("initialize", {
            "protocolVersion": "2025-03-26",
            "capabilities": {},
            "clientInfo": {"name": AGENT_NAME, "version": "1.0.0"}
        })
        print(f"[mcp] Initialized: {result.get('result', {}).get('serverInfo', {})}")
        return result

    def _mcp_list_tools():
        result = _mcp_request("tools/list")
        tools = result.get("result", {}).get("tools", [])
        print(f"[mcp] Discovered {len(tools)} tools")
        return tools

    def _mcp_call_tool(name, arguments):
        result = _mcp_request("tools/call", {"name": name, "arguments": arguments})
        content = result.get("result", {}).get("content", [])
        if content and content[0].get("type") == "text":
            try:
                return json.loads(content[0]["text"])
            except json.JSONDecodeError:
                return {"text": content[0]["text"]}
        return result.get("result", result)

    # ─── JWT Decode (no signature verification — internal use) ─────────────
    import base64

    def _decode_jwt(token):
        try:
            payload = token.split(".")[1]
            payload += "=" * (4 - len(payload) % 4)
            return json.loads(base64.b64decode(payload))
        except Exception:
            return {}

    # ─── OPA Policy Enforcement Point ────────────────────────────────────────
    def _opa_check(tool_name, args, user="anonymous", groups=None):
        if not OPA_URL:
            return True, []
        payload = json.dumps({"input": {
            "agent": AGENT_NAME,
            "tool": tool_name,
            "args": args or {},
            "user": user,
            "groups": groups or [],
        }}).encode()
        req = urllib.request.Request(
            f"{OPA_URL}{OPA_DECISION_PATH}",
            data=payload,
            headers={"Content-Type": "application/json"},
        )
        try:
            with urllib.request.urlopen(req, timeout=5) as resp:
                result = json.loads(resp.read()).get("result", {})
            decision = result.get("decision", result)
            if isinstance(decision, dict):
                allow = decision.get("allow", True)
                reasons = decision.get("reasons", [])
            else:
                allow = True
                reasons = []
            print(f"[opa] tool={tool_name} user={user} groups={groups} allow={allow} reasons={reasons}")
            return allow, reasons
        except Exception as e:
            print(f"[opa] Error (allowing by default): {e}")
            return True, []

    # ─── DeepSeek LLM Client ────────────────────────────────────────────────
    def _deepseek_chat(messages, tools=None):
        payload = {
            "model": DEEPSEEK_MODEL,
            "messages": messages,
            "temperature": 0.3,
        }
        if tools:
            payload["tools"] = tools
            payload["tool_choice"] = "auto"
        body = json.dumps(payload).encode()
        ctx = ssl.create_default_context()
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE
        req = urllib.request.Request(
            f"{DEEPSEEK_BASE_URL}/chat/completions",
            data=body,
            headers={
                "Content-Type": "application/json",
                "Authorization": f"Bearer {DEEPSEEK_API_KEY}",
            },
        )
        with urllib.request.urlopen(req, context=ctx, timeout=60) as resp:
            return json.loads(resp.read())

    # ─── Qwen3.5 XML Tool-Call Parser ─────────────────────────────────────────
    import re

    def _parse_xml_tool_calls(content):
        """Parse Qwen3.5 XML tool-call format:
        <tool_call><function=name><parameter=key>value</parameter></function></tool_call>
        Returns list of {"name": ..., "arguments": {...}} or empty list if no XML tools found.
        """
        calls = []
        pattern = r'<tool_call>\s*<function=([^>]+)>(.*?)</function>\s*</tool_call>'
        for match in re.finditer(pattern, content, re.DOTALL):
            fn_name = match.group(1).strip()
            params_block = match.group(2)
            args = {}
            param_pattern = r'<parameter=([^>]+)>(.*?)</parameter>'
            for pm in re.finditer(param_pattern, params_block, re.DOTALL):
                key = pm.group(1).strip()
                val = pm.group(2).strip()
                try:
                    val = json.loads(val)
                except (json.JSONDecodeError, ValueError):
                    pass
                args[key] = val
            calls.append({"name": fn_name, "arguments": args})
        return calls

    # ─── Agent Loop ──────────────────────────────────────────────────────────
    _tools_cache = None
    _tools_openai_format = None

    def _get_tools():
        global _tools_cache, _tools_openai_format
        if _tools_cache is None:
            try:
                _mcp_initialize()
                _tools_cache = _mcp_list_tools()
            except Exception as e:
                print(f"[agent] Failed to discover tools from MCP Gateway: {e}")
                _tools_cache = []
            _tools_openai_format = []
            for t in _tools_cache:
                _tools_openai_format.append({
                    "type": "function",
                    "function": {
                        "name": t["name"],
                        "description": t.get("description", ""),
                        "parameters": t.get("inputSchema", {"type": "object", "properties": {}}),
                    }
                })
        return _tools_cache, _tools_openai_format

    def run_agent(user_message, user="anonymous", groups=None):
        _, openai_tools = _get_tools()
        messages = [
            {"role": "system", "content": SYSTEM_PROMPT},
            {"role": "user", "content": user_message},
        ]
        tool_calls_log = []
        max_iterations = 8
        groups = groups or []

        for _ in range(max_iterations):
            response = _deepseek_chat(messages, openai_tools if openai_tools else None)
            choice = response["choices"][0]
            msg = choice["message"]

            # Check for OpenAI-format tool_calls first
            if msg.get("tool_calls"):
                messages.append(msg)
                for tc in msg["tool_calls"]:
                    fn = tc["function"]
                    tool_name = fn["name"]
                    try:
                        args = json.loads(fn["arguments"]) if fn["arguments"] else {}
                    except json.JSONDecodeError:
                        args = {}

                    allowed, reasons = _opa_check(tool_name, args, user, groups)
                    if not allowed:
                        result_text = f"POLICY DENIED: {' '.join(reasons)}. Do not retry this tool."
                        tool_calls_log.append({"tool": tool_name, "args": args, "status": "DENIED", "reasons": reasons})
                    else:
                        try:
                            result = _mcp_call_tool(tool_name, args)
                            result_text = json.dumps(result)
                            tool_calls_log.append({"tool": tool_name, "args": args, "status": "SUCCESS", "result": result})
                        except Exception as e:
                            result_text = f"Tool call failed: {str(e)}"
                            tool_calls_log.append({"tool": tool_name, "args": args, "status": "ERROR", "error": str(e)})

                    messages.append({"role": "tool", "tool_call_id": tc["id"], "content": result_text})

            # Check for Qwen3.5 XML tool-call format in content
            elif msg.get("content") and "<tool_call>" in msg.get("content", ""):
                xml_calls = _parse_xml_tool_calls(msg["content"])
                if xml_calls:
                    messages.append(msg)
                    for xc in xml_calls:
                        tool_name = xc["name"]
                        args = xc["arguments"]
                        tc_id = str(uuid.uuid4())

                        allowed, reasons = _opa_check(tool_name, args, user, groups)
                        if not allowed:
                            result_text = f"POLICY DENIED: {' '.join(reasons)}. Do not retry this tool."
                            tool_calls_log.append({"tool": tool_name, "args": args, "status": "DENIED", "reasons": reasons})
                        else:
                            try:
                                result = _mcp_call_tool(tool_name, args)
                                result_text = json.dumps(result)
                                tool_calls_log.append({"tool": tool_name, "args": args, "status": "SUCCESS", "result": result})
                            except Exception as e:
                                result_text = f"Tool call failed: {str(e)}"
                                tool_calls_log.append({"tool": tool_name, "args": args, "status": "ERROR", "error": str(e)})

                        messages.append({"role": "tool", "tool_call_id": tc_id, "content": result_text})
                else:
                    return {"response": msg.get("content", ""), "tool_calls": tool_calls_log}
            else:
                return {"response": msg.get("content", ""), "tool_calls": tool_calls_log}

        return {"response": "Maximum iterations reached.", "tool_calls": tool_calls_log}

    # ─── HTTP Server ─────────────────────────────────────────────────────────
    class AgentHandler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            print(f"[http] {args[0]}" if args else "")

        def _send(self, code, body, content_type="application/json"):
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.send_header("Access-Control-Allow-Origin", "*")
            self.send_header("Access-Control-Allow-Headers", "*")
            self.send_header("Access-Control-Allow-Methods", "*")
            self.end_headers()
            if isinstance(body, str):
                body = body.encode()
            self.wfile.write(body)

        def do_OPTIONS(self):
            self._send(204, b"")

        def do_GET(self):
            if self.path == "/health":
                self._send(200, json.dumps({"status": "ok"}))
            elif self.path in ("/.well-known/agent.json", "/.well-known/agent-card.json"):
                card = {
                    "name": AGENT_NAME,
                    "title": AGENT_TITLE,
                    "description": "DBS Loan Processing Agent — handles home, personal, and renovation loan applications with automated credit checks, KYC verification, affordability analysis, and policy-governed tool access.",
                    "version": "1.0.0",
                    "protocol": "a2a",
                    "url": f"http://{AGENT_NAME}.team1.svc:8080",
                    "capabilities": {"tools": True, "streaming": False},
                    "skills": [
                        {"name": "Loan Application Processing", "description": "End-to-end loan processing with credit checks and affordability analysis"},
                        {"name": "KYC Verification", "description": "Identity verification and PEP screening"},
                        {"name": "Policy-Governed Access", "description": "All tool calls are governed by OPA policies managed by bank compliance officers"},
                    ],
                    "tools": [
                        {"name": "loan_credit_credit_check", "description": "Run a credit bureau check for a customer. Returns credit score, grade, and history length."},
                        {"name": "loan_credit_credit_score", "description": "Get just the numeric credit score for quick decisioning."},
                        {"name": "loan_kyc_kyc_verify", "description": "Verify a customer identity document (passport, NRIC, driver license)."},
                        {"name": "loan_kyc_pep_screen", "description": "Screen a person against the Politically Exposed Persons (PEP) database."},
                        {"name": "loan_calc_loan_calculate", "description": "Calculate monthly repayment, total interest, and total cost for a loan."},
                        {"name": "loan_calc_affordability_check", "description": "Check if a customer can afford a loan based on MAS TDSR (55%)."},
                        {"name": "loan_notify_send_notification", "description": "Send a notification (SMS/email) to a customer about their loan application."},
                        {"name": "loan_notify_send_approval_letter", "description": "Generate and send an official loan approval letter to the customer."},
                    ],
                }
                self._send(200, json.dumps(card))
            elif self.path == "/chat" or self.path == "/":
                with open("/ui/index.html") as f:
                    self._send(200, f.read(), "text/html")
            elif self.path == "/api/tools":
                tools, _ = _get_tools()
                self._send(200, json.dumps({"tools": [{"name": t["name"], "description": t.get("description", "")} for t in tools]}))
            else:
                self._send(404, json.dumps({"error": "not found"}))

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(length)) if length else {}

            if self.path == "/api/chat":
                message = body.get("message", "")
                if not message:
                    self._send(400, json.dumps({"error": "message required"}))
                    return

                # Extract user identity from JWT Authorization header
                user = "anonymous"
                groups = []
                auth_header = self.headers.get("Authorization", "")
                if auth_header.startswith("Bearer "):
                    claims = _decode_jwt(auth_header[7:])
                    user = claims.get("preferred_username", "anonymous")
                    groups = claims.get("groups", [])
                    print(f"[auth] user={user} groups={groups}")

                try:
                    result = run_agent(message, user, groups)
                    self._send(200, json.dumps(result))
                except Exception as e:
                    print(f"[agent] Error: {e}")
                    self._send(500, json.dumps({"error": str(e)}))
            else:
                self._send(404, json.dumps({"error": "not found"}))

    if __name__ == "__main__":
        print(f"[agent] {AGENT_TITLE} starting on port {PORT}")
        print(f"[agent] MCP Gateway: {MCP_GATEWAY_URL}")
        print(f"[agent] OIDC: {OIDC_TOKEN_URL}")
        print(f"[agent] OPA: {OPA_URL}")
        server = HTTPServer(("0.0.0.0", PORT), AgentHandler)
        server.serve_forever()


    .header .user-info .username{color:#ccc}
    .header .user-info .role-badge{background:#333;color:#4fc3f7;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;border:1px solid #4fc3f7}
    .header .user-info .role-badge.senior-rm{color:#66bb6a;border-color:#66bb6a}
    .header .user-info .role-badge.rm{color:#ffa726;border-color:#ffa726}
    .header .user-info .role-badge.teller{color:#4fc3f7;border-color:#4fc3f7}
    .header .logout-btn{background:transparent;color:#999;border:1px solid #555;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer}
    .header .logout-btn:hover{color:#fff;border-color:#ee0000}
    .chat-area{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
    .msg{max-width:80%;padding:14px 18px;border-radius:12px;line-height:1.5;font-size:14px;animation:fadeIn 0.3s}
    .msg.user{align-self:flex-end;background:#1a4d8f;color:#fff;border-bottom-right-radius:4px}
    .msg.agent{align-self:flex-start;background:#252525;border:1px solid #333;border-bottom-left-radius:4px}
    .msg.agent .tool-call{margin:8px 0;padding:8px 12px;border-radius:6px;font-size:12px;font-family:monospace}
    .msg.agent .tool-call.success{background:#1a3d1a;border:1px solid #2e7d32}
    .msg.agent .tool-call.denied{background:#3d1a1a;border:1px solid #c62828}
    .msg.agent .tool-call.error{background:#3d2a1a;border:1px solid #e65100}
    .input-area{background:#1a1a1a;border-top:1px solid #333;padding:16px 24px;display:flex;gap:12px}
    .input-area input{flex:1;background:#252525;border:1px solid #444;border-radius:8px;padding:12px 16px;color:#fff;font-size:14px;outline:none}

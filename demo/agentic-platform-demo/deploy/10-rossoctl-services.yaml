# ============================================================================
# 2. CAPTURE THE FLAG — Security Testing Scenarios
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ctf-security-app
  namespace: team1
data:
  server.py: |
    import os, json, time, uuid
    from http.server import HTTPServer, BaseHTTPRequestHandler

    HR_DOCUMENTS = [
        {"id": "HR-001", "title": "Employee Salary Database", "classification": "CONFIDENTIAL"},
        {"id": "HR-002", "title": "Executive Bonus Structure", "classification": "SECRET"},
        {"id": "HR-003", "title": "Performance Review Templates", "classification": "INTERNAL"},
    ]

    ctf_results = []

    SCENARIOS = [
        {"id": "leaked-token", "name": "Leaked Service Token", "difficulty": "Medium", "category": "credential-theft"},
        {"id": "privilege-escalation", "name": "Role Escalation via Group Injection", "difficulty": "Hard", "category": "authz-bypass"},
        {"id": "lateral-movement", "name": "Cross-Namespace Data Access", "difficulty": "Hard", "category": "network-breach"},
        {"id": "prompt-injection", "name": "Agent Prompt Injection", "difficulty": "Easy", "category": "ai-safety"},
        {"id": "data-exfiltration", "name": "Customer PII Extraction", "difficulty": "Medium", "category": "data-loss"},
    ]

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            elif self.path == "/api/scenarios":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(SCENARIOS).encode())
            elif self.path == "/api/results":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(ctf_results[-20:]).encode())
            elif self.path == "/api/documents":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"error": "ACCESS DENIED — SPIFFE identity not in authorized list", "required_spiffe_id": "spiffe://cluster.local/ns/hr-system/sa/hr-admin"}).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            if self.path == "/api/run-scenario":
                length = int(self.headers.get("Content-Length", 0))
                body = json.loads(self.rfile.read(length)) if length else {}
                scenario_id = body.get("scenario_id", "")
                result = {"id": str(uuid.uuid4())[:8], "scenario": scenario_id, "timestamp": time.time(), "status": "BLOCKED", "reason": "Defense layer prevented attack"}
                ctf_results.append(result)
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(result).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()


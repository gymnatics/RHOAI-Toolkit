# ============================================================================
# 4. SERVERLESS HARNESS — Scale-to-Zero Agent Fleet
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: serverless-harness-app
  namespace: team1
data:
  server.py: |
    import os, json, time, random, uuid
    from http.server import HTTPServer, BaseHTTPRequestHandler

    FLEET_SIZE = 200
    agents = []
    for i in range(FLEET_SIZE):
        agents.append({
            "name": f"agent-{i:03d}", "status": random.choice(["running", "scaled-to-zero", "scaled-to-zero", "scaled-to-zero"]),
            "last_invocation": time.time() - random.randint(60, 86400),
            "cold_starts_24h": random.randint(0, 15), "avg_cold_start_ms": random.randint(800, 3000)
        })

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            elif self.path == "/api/fleet/status":
                running = sum(1 for a in agents if a["status"] == "running")
                scaled = FLEET_SIZE - running
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"total": FLEET_SIZE, "running": running, "scaled_to_zero": scaled, "cost_savings_pct": round(scaled / FLEET_SIZE * 100, 1)}).encode())
            elif self.path == "/api/cost-analysis":
                always_on_cost = FLEET_SIZE * 0.05 * 24 * 30
                actual_cost = sum(0.05 * 24 * 30 if a["status"] == "running" else 0.001 * 30 for a in agents)
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"always_on_monthly_usd": round(always_on_cost, 2), "serverless_monthly_usd": round(actual_cost, 2), "savings_usd": round(always_on_cost - actual_cost, 2), "savings_pct": round((1 - actual_cost / always_on_cost) * 100, 1)}).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps({"status": "invoked", "cold_start_ms": random.randint(800, 2500)}).encode())

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment

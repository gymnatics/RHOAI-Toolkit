# ============================================================================
# 3. WORKLOAD HARNESS — Load Generation & Benchmarks
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-harness-app
  namespace: team1
data:
  server.py: |
    import os, json, time, random, uuid
    from http.server import HTTPServer, BaseHTTPRequestHandler

    benchmark_results = []
    for i in range(5):
        benchmark_results.append({
            "id": str(uuid.uuid4())[:8], "timestamp": time.time() - (i * 3600),
            "scenario": random.choice(["sustained-load", "burst", "cold-start"]),
            "rps": random.randint(50, 200), "p50_ms": random.randint(100, 300),
            "p95_ms": random.randint(300, 800), "p99_ms": random.randint(500, 1500),
            "error_rate": round(random.uniform(0, 2.5), 2), "duration_s": 300
        })

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            elif self.path == "/api/results":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(benchmark_results).encode())
            elif self.path == "/api/results/latest":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(benchmark_results[0] if benchmark_results else {}).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            if self.path == "/api/run":
                result = {"id": str(uuid.uuid4())[:8], "status": "running", "started": time.time()}
                self.send_response(202)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(result).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()


---
# ============================================================================
# 1. CONTEXT GURU — Token Compaction Proxy
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: context-guru-app
  namespace: team1
data:
  server.py: |
    import os, json, time, hashlib
    from http.server import HTTPServer, BaseHTTPRequestHandler

    stats = {"requests": 0, "tokens_in": 0, "tokens_out": 0, "savings_pct": 0.0}

    def estimate_tokens(text):
        return max(1, len(text) // 4)

    def compact_messages(messages):
        if len(messages) <= 4:
            return messages
        system = [m for m in messages if m.get("role") == "system"]
        recent = messages[-3:]
        middle = messages[len(system):-3]
        if not middle:
            return messages
        summary_text = f"[Summary of {len(middle)} previous messages: User discussed topics including "
        topics = set()
        for m in middle:
            words = m.get("content", "").split()[:5]
            if words:
                topics.add(" ".join(words))
        summary_text += ", ".join(list(topics)[:3]) + "...]"
        compacted = system + [{"role": "assistant", "content": summary_text}] + recent
        return compacted

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            elif self.path == "/stats":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(stats).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(length)) if length else {}
            messages = body.get("messages", [])
            tokens_in = sum(estimate_tokens(m.get("content", "")) for m in messages)
            compacted = compact_messages(messages)
            tokens_out = sum(estimate_tokens(m.get("content", "")) for m in compacted)
            stats["requests"] += 1
            stats["tokens_in"] += tokens_in
            stats["tokens_out"] += tokens_out
            stats["savings_pct"] = round((1 - stats["tokens_out"] / max(1, stats["tokens_in"])) * 100, 1)
            body["messages"] = compacted
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(json.dumps(body).encode())

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        port = int(os.getenv("PORT", "8080"))
        print(f"Context Guru listening on :{port}")
        HTTPServer(("0.0.0.0", port), Handler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-guru
  namespace: team1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context-guru
  template:
    metadata:
      labels:
        app: context-guru
    spec:
      containers:
      - name: guru
        image: registry.access.redhat.com/ubi9/python-311:latest
        command: ["python3", "/app/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: app
          mountPath: /app
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: app
        configMap:
          name: context-guru-app

---
apiVersion: v1
kind: Service
metadata:
  name: context-guru
  namespace: team1
spec:
  selector:
    app: context-guru
  ports:
  - port: 8080

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: context-guru
  namespace: team1
spec:
  to:
    kind: Service
    name: context-guru
  port:
    targetPort: 8080
  tls:
    termination: edge


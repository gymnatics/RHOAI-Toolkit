# 10-rossoctl-services.yaml
# Rossoctl Platform Capabilities:
# 1. Context Guru (token compaction proxy)
# 2. Capture the Flag (security testing)
# 3. Workload Harness (load generation)
# 4. Serverless Harness (scale-to-zero agents)
# 5. Agent Skills (self-maintenance agents)
